<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="E-commerce homepage lab: semantic HTML and responsive CSS.">

    <title>Amazon.com. Spend less. Smile more.</title>

    <link rel="icon" href="./amazon_logo.png" type="image/png">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link rel="stylesheet" href="./style_ecommerce_assignment.css">
</head>

<body id="top">

    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">

        <!-- SECTION 1 - Top belt: logo, location, search, language, account, orders, cart -->
        <div class="nav-belt" data-section="1">
        </div>

        <!-- SECTION 2 - Secondary navigation: All menu, links, promo -->
        <div class="nav-main" data-section="2">
        </div>

    </header>

    <main id="main">

        <!-- SECTION 3 - Hero banner: full-width image that fades into the page -->
        <div class="hero" data-section="3">
        </div>

        <!-- SECTION 4 - Page content: notice, category cards, best-seller shelf -->
        <div class="page-content" data-section="4">
        </div>

    </main>

    <footer class="site-footer">

        <!-- SECTION 5 - Footer 1: back to top, link columns, logo and locale -->
        <div class="footer-nav" data-section="5">
        </div>

        <!-- SECTION 6 - Footer 2: services, legal links, copyright -->
        <div class="footer-services" data-section="6">
        </div>

    </footer>

</body>
</html>
